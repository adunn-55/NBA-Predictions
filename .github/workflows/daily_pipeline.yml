name: Daily NBA Prediction Pipeline

on:
  schedule:
    # Runs every day at 20:00 UTC (4:00 PM EST)
    - cron: '0 20 * * *'
  workflow_dispatch: # Gives you the manual button in GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        # Since we haven't committed requirements.txt yet, we can install directly:
        pip install pandas nba_api scikit-learn xgboost

    - name: Run NBA Prediction Pipeline
      run: python main.py

    - name: Commit and Push Updated Predictions
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        # Force add predictions file and model if generated
        git add -f predictions_today.md pipeline/nba_model.pkl || true
        git diff-index --quiet HEAD || git commit -m "🤖 Auto-updated daily predictions [skip ci]"
        git push
